[package]
name = "backup-mic"
version = "0.260815.0"
description = "Safe local backups for removable audio recorders"
authors = ["channprj"]
license = "MIT"
edition = "2024"
rust-version = "1.97"
default-run = "backup-mic"

[features]
recovery-tool = []

[[bin]]
name = "backup-mic"
path = "src/main.rs"

[[bin]]
name = "recover_verified_recordings"
path = "src/bin/recover_verified_recordings.rs"
required-features = ["recovery-tool"]

[lib]
name = "backup_mic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/backup-core"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
backup-core = { path = "crates/backup-core" }
directories = "=6.0.0"
parking_lot = "=0.12.5"
quick-xml = { version = "=0.41.0", features = ["serialize"] }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-positioner = { version = "=2.3.3", features = ["tray-icon"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting", "macros", "serde"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
libc = "=0.2.189"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = ["NSFileManager", "NSError", "NSURL"] }

[dev-dependencies]
tempfile = "=3.27.0"
