[package]
name = "backup-core"
version = "0.260815.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
fs2 = "=0.4.3"
globset = "=0.4.19"
parking_lot = "=0.12.5"
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.11.0"
thiserror = "=2.0.20"
tempfile = "=3.27.0"
time = { version = "=0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
unicode-normalization = "=0.1.25"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "=1.11.0"
serde_json = "=1.0.151"
